---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@main
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite:
          - "installation-package"
          - "installation-tarball"
          - "installation-script"
          - "install-and-stop"
          - "resources"
          - "network"
          - "volume"
          - "registry"
          - "swarm"
          - "smoke"
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Test Kitchen
        uses: ./.github/actions/test-kitchen
        with:
          kitchen-yaml: kitchen.exec.yml
          suite: ${{ matrix.suite }}
          os: "ubuntu-latest"
          license-id: ${{ secrets.CHEF_LICENSE_KEY }}

  final:
    needs: [lint-unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "All tests passed"
